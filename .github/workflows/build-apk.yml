name: Build WATER340 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - "README.md"
      - "AI2_BLOCK_MAPPING.md"
      - "GITHUB_APK_BUILD.md"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev automake autopoint \
            gettext curl

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython<3.1" buildozer

      - name: Verify pinned Android Python
        run: |
          echo "=== buildozer requirements ==="
          grep -n "^requirements" buildozer.spec
          python --version

      - name: Clean previous Android build
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          rm -rf .buildozer bin

      - name: Build debug APK
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          buildozer -v android debug

      - name: Show generated files
        if: always()
        run: |
          echo "=== bin directory ==="
          find bin -maxdepth 2 -type f -print 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WATER340-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
